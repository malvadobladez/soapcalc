<!doctype html>
<html lang="en" data-theme="brenda">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apothecary Catalog | The Hidden Grimoire</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/grimoire-account.css?v=workspace-shell">
<link rel="stylesheet" href="/static/css/apothecary-table.css?v=shared-toolbar">
<style>

      .entry-dialog { margin:auto; width:min(92vw,46rem); max-height:88vh; overflow:auto; }
    .entry-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; }
    .entry-grid label { display:grid; gap:.25rem; min-width:0; }
    .entry-grid input, .entry-grid select { width:100%; min-width:0; }
    .entry-grid [hidden], #edit-status:empty, #handoff-status:empty { display:none; }
    .entry-grid #name-field { grid-column:1/-1; }
    @media(max-width:540px) { .entry-grid { grid-template-columns:1fr; } }
      .catalog-heading { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:.75rem 1rem; }
    .catalog-heading .catalog-counts { justify-content:flex-end; }
    @media(max-width:1000px) {
      .catalog-heading { grid-template-columns:minmax(0,1fr); }
    }
    .catalog-counts,.catalog-toolbar,.catalog-admin-actions { display:flex; flex-wrap:wrap; align-items:center; gap:.65rem; }
    .catalog-counts[hidden],.catalog-admin-actions[hidden] { display:none; }
    .catalog-pill,.catalog-stock { display:inline-flex; align-items:center; gap:.65rem; border:1px solid var(--color-base-300); background:var(--color-base-200); }
    .catalog-pill { border-radius:999px; padding:.55rem .95rem; white-space:nowrap; }
    .catalog-pill:last-child { color:var(--color-primary); background:#35584614; }
    #status { margin-top:.65rem; color:var(--color-neutral); }




  </style>
  <script defer src="/static/js/grimoire-nav.js?v=workspace-shell"></script>
</head>
<body class="app-shell antialiased">
<div class="workspace-frame">
<aside class="workspace-sidebar surface-panel p-5" data-grimoire-sidebar="/apothecary-catalog"></aside>
<main class="workspace-main">
  <header class="surface-panel px-5 py-4" data-grimoire-header="Apothecary Catalog">
    <nav class="grimoire-nav grimoire-mobile" aria-label="Workspace" data-grimoire-nav="/apothecary-catalog"></nav>
  </header>
  <section class="surface-panel p-6">
    <div class="catalog-heading">
      <div>
        <p class="section-kicker">Ingredient Reference</p>
        <h1 class="dashboard-title mt-2">The apothecary’s materia.</h1>
        <p class="mt-2 text-neutral/75">Browse the oils, herbs, scents, and other materials recorded in the Grimoire. Open an entry to see its properties, or add it to My Apothecary to track your own stock and costs.</p>
      </div>
      <div id="counts" class="catalog-counts" aria-live="polite" hidden></div>
    </div>
    <p id="status" role="status">Connecting…</p>

    <div id="workspace" hidden>
      <div class="catalog-toolbar">
        <input id="search" type="search" class="input input-bordered bg-base-100" aria-label="Search the catalog" placeholder="Search the catalog…">
        <select id="category" class="select select-bordered bg-base-100" aria-label="Category"></select>
        <select id="form" class="select select-bordered bg-base-100" aria-label="Form"></select>
        <label class="catalog-stock"><input id="stock-only" type="checkbox" class="checkbox checkbox-sm"> In My Apothecary only</label>
        <button id="clear" title="Clear search and filters" type="button" class="btn btn-ghost rounded-full">Lift Filters</button>
        <button id="refresh" title="Reload the catalog and your inventory status" type="button" class="btn btn-ghost rounded-full">Refresh</button>
        <div id="catalog-admin" class="catalog-admin-actions" hidden>
          <button id="bulk-edit" title="Enter or exit bulk editing" type="button" class="btn btn-secondary rounded-full">Bulk Edit</button>
          <button id="new-item" title="Create a shared catalog entry" type="button" class="btn btn-primary rounded-full">Add to the Catalog</button>

          <button id="edit-selected" title="Edit the selected catalog entries" type="button" class="btn btn-primary rounded-full" hidden>Edit selected</button>
        </div>
      </div>
      <dialog id="editor" class="surface-panel p-6 entry-dialog" aria-labelledby="edit-title">
        <form id="edit-form" class="space-y-4">
          <h2 id="edit-title" class="text-2xl">Catalog item</h2>
          <div class="entry-grid">
            <label id="name-field">Name <input name="name" class="input input-bordered" maxlength="255"></label>
            <label>Category <select name="category" class="select select-bordered"></select></label>
            <label>Form <input name="form" class="input input-bordered" maxlength="50" list="catalog-editor-forms"><datalist id="catalog-editor-forms"></datalist></label>
            <label>Status <select name="is_active" class="select select-bordered"><option value="">Keep existing</option><option value="true">Active</option><option value="false">Inactive</option></select></label>
          </div>
          <p id="edit-status" role="status"></p>
          <div class="flex flex-wrap items-center justify-end gap-2">
            <button id="close-editor" type="button" class="btn btn-ghost rounded-full" title="Close without saving catalog changes">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-full" title="Save the catalog entry or selected changes">Save</button>
          </div>
        </form>
      </dialog>
      <dialog id="inventory-handoff" class="surface-panel p-6 entry-dialog" aria-labelledby="handoff-title">
        <form id="handoff-form" class="space-y-4">
          <p class="section-kicker">Add to My Apothecary</p>
          <h2 id="handoff-title" class="text-2xl"></h2>
          <div class="entry-grid">
            <label>Supplier <input class="input input-bordered" name="supplier" maxlength="120"></label>
            <label>Manufacturer <input class="input input-bordered" name="manufacturer" maxlength="120"></label>
            <label>Purchase amount <input class="input input-bordered" name="purchase_quantity" type="number" min=".0001" max="9999999999.9999" step=".0001"></label>
            <label>Purchase unit <select class="select select-bordered" name="purchase_unit"></select></label>
            <label>Total purchase cost <input class="input input-bordered" name="purchase_total_cost" type="number" min="0" max="99999999.99" step=".01"></label>
            <label>Markup % <input class="input input-bordered" name="markup_percent" type="number" min="0" max="99999.99" step=".01" value="0"></label>
          </div>
          <p id="handoff-pricing" class="text-sm text-neutral/75"></p>
          <p id="handoff-status" role="status"></p>
          <div class="flex flex-wrap items-center justify-end gap-2">
            <button id="handoff-cancel" type="button" class="btn btn-ghost rounded-full" title="Close without adding this ingredient">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-full" title="Add this ingredient to your personal stock list">Add to My Apothecary</button>
          </div>
        </form>
      </dialog>
      <div class="catalog-scroll mt-4">
        <table class="table catalog-grid">
          <thead><tr><th scope="col"><button type="button" data-catalog-sort="name">Name<span aria-hidden="true"></span></button></th><th scope="col"><button type="button" data-catalog-sort="category">Category<span aria-hidden="true"></span></button></th><th scope="col"><button type="button" data-catalog-sort="form">Form<span aria-hidden="true"></span></button></th><th scope="col"><button type="button" data-catalog-sort="inventory">Inventory<span aria-hidden="true"></span></button></th><th scope="col">Actions</th></tr></thead>
          <tbody id="catalog"></tbody>
        </table>
      </div>
      <p id="catalog-note" class="mt-4"></p>
      <div class="flex items-center gap-3 mt-4">
        <button id="previous" type="button" class="btn btn-ghost">Previous</button>
        <button id="next" type="button" class="btn btn-ghost">Next</button>
      </div>
    </div>
  </section>
</main>
</div>
<script data-cfasync="false" type="module">
import { db } from "/static/js/grimoire-account.js?v=floating-chat-1";
import { viewItem } from "/static/js/ingredient-details.js";
import { purchaseUnitLabels, purchaseCostSummary } from "/static/js/purchase-cost.js";
const by = id => document.getElementById(id);
const tell = message => { by("status").textContent = message; };
let revision = 0;
const element = (tag, value) => { const item = document.createElement(tag); item.textContent = value; return item; };

const pageSize = 50;

let items = [];
let owned = new Map();
let page = 0;
let sortKey = "name";
let sortDirection = 1;
const sortHeaders = [...document.querySelectorAll("[data-catalog-sort]")];
for (const button of sortHeaders) button.onclick = () => {
  const key = button.dataset.catalogSort;
  sortDirection = sortKey === key ? -sortDirection : 1;
  sortKey = key;
  page = 0;
  render();
};
let admin = false;
let bulkMode = false;
let editIds = [];
const selected = new Set();

const catalogEditor = by("edit-form");
let editorSaving = false;
by("editor").addEventListener("cancel", event => {
  if (editorSaving) event.preventDefault();
});
const editorCategory = item => item?.item_class || item?.category || "";

function setEditorForms() {
  const category = catalogEditor.elements.category.value;
  const values = items.filter(item => editorCategory(item) === category).map(item => item.form);
  const forms = [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b));
  by("catalog-editor-forms").replaceChildren(...forms.map(value => new Option(value, value)));
  catalogEditor.elements.form.disabled = !category;
  catalogEditor.elements.form.placeholder = category ? "Choose or enter a form" : "Choose a category first";
}

catalogEditor.elements.category.onchange = () => {
  catalogEditor.elements.form.value = "";
  setEditorForms();
};

function edit(ids = []) {
  if (editorSaving || !admin) return;
  const form = by("edit-form");
  const item = ids.length === 1 ? items.find(row => row.id === ids[0]) : null;
  editIds = ids;
  form.reset();
  const bulk = ids.length > 1;
  by("edit-title").textContent = bulk ? "Edit " + ids.length + " selected items" : item ? "Edit catalog item" : "Add to the Catalog";
  by("name-field").hidden = bulk;
  form.elements.is_active.value = bulk ? "" : String(item?.is_active ?? true);
  form.elements.name.required = !bulk;
  form.elements.name.value = item?.name ?? "";
  const original = editorCategory(item);
  const categories = [...new Set(items.map(editorCategory).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  form.elements.category.replaceChildren(new Option(bulk ? "Keep existing" : "Choose a category", ""), ...categories.map(value => new Option(value, value)));
  form.elements.category.required = !bulk;
  form.elements.category.value = original;
  setEditorForms();
  form.elements.form.value = item?.form ?? "";
  by("edit-status").textContent = bulk ? "Blank fields leave existing values in place." : "";
  by("editor").showModal();
}

by("new-item").onclick = () => edit();
by("bulk-edit").onclick = () => {
  bulkMode = !bulkMode;
  selected.clear();
  render();
};
by("edit-selected").onclick = () => {
  if (selected.size) edit([...selected]);
  else tell("Select at least one catalog item.");
};
by("close-editor").onclick = () => { if (!editorSaving) by("editor").close(); };
by("edit-form").onsubmit = async event => {
  event.preventDefault();
  if (!admin || editorSaving) return;
  const form = event.currentTarget;
  const submit = form.querySelector('[type="submit"]');
  const ids = [...editIds];
  const bulk = editIds.length > 1;
  const values = {};
  for (const [field, raw] of new FormData(form)) {
    const value = raw.trim();
    if (bulk && (field === "name" || !value)) continue;
    if (field === "is_active") { if (value) values[field] = value === "true"; continue; }
    if (field === "category") {
      const original = editIds.length === 1 ? items.find(item => item.id === editIds[0]) : null;
      if (value && value !== editorCategory(original)) {
        values.category = value;
        values.item_class = value;
      }
      continue;
    }
    values[field] = value || null;
  }
  if ((!bulk && !values.name) || !Object.keys(values).length) {
    by("edit-status").textContent = bulk ? "Enter at least one change." : "Enter a name.";
    return;
  }
  if (bulk && (values.category || values.form)) {
    const invalid = items.filter(item => {
      if (!ids.includes(item.id)) return false;
      const category = values.category ?? editorCategory(item);
      const form = values.form ?? item.form;
      if (category === editorCategory(item) && form === item.form) return false;
      return !form || !items.some(entry => editorCategory(entry) === category && entry.form === form);
    });
    if (invalid.length) {
      const names = invalid.slice(0, 4).map(item => item.name).join(", ");
      by("edit-status").textContent = "Choose a form valid for the resulting category for " + names +
        (invalid.length > 4 ? " and " + (invalid.length - 4) + " more." : ".");
      return;
    }
  }

  editorSaving = submit.disabled = by("close-editor").disabled = true;
  try {
    const query = ids.length
      ? db.from("master_items").update(values).in("id", ids)
      : db.from("master_items").insert(values);
    const { data, error } = await query.select("id");
    if (error || data?.length !== (ids.length || 1)) throw error ?? new Error("Unexpected saved row count");
    by("editor").close();
    selected.clear();
    await catalog();
  } catch {
    by("edit-status").textContent = "Could not save the catalog changes. Check access and item names.";
  } finally {
    editorSaving = submit.disabled = by("close-editor").disabled = false;
  }
};

import { readPages } from "/static/js/read-pages.js";

function choices(select, values, label) {
  const selected = select.value;
  const list = [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b));
  select.replaceChildren(new Option(label, ""), ...list.map(value => new Option(value, value)));
  if (list.includes(selected)) select.value = selected;
}

function render() {
  by("bulk-edit").textContent = bulkMode ? "Cancel Bulk Edit" : "Bulk Edit";
  by("edit-selected").hidden = !bulkMode;
  const category = by("category");
  const form = by("form");
  const term = by("search").value.trim().toLowerCase();
  choices(category, items.map(item => item.category), "All Categories");
  const categoryItems = items.filter(item => !category.value || item.category === category.value);
  choices(form, category.value ? categoryItems.map(item => item.form) : [], category.value ? "All forms" : "Choose category first");
  form.disabled = !category.value;
  const visible = categoryItems.filter(item =>
    (!form.value || item.form === form.value) &&
    (!by("stock-only").checked || owned.has(item.id)) &&
    [item.name, item.category, item.form].some(value => value?.toLowerCase().includes(term))
  );
  const value = item => sortKey === "inventory" ? Number(owned.has(item.id)) : item[sortKey];
  visible.sort((left, right) => {
    const a = value(left);
    const b = value(right);
    if (a == null || b == null) return Number(a == null) - Number(b == null) || left.name.localeCompare(right.name);
    const order = sortKey === "inventory" ? a - b : a.localeCompare(b);
    return sortDirection * order || left.name.localeCompare(right.name) || left.id - right.id;
  });
  for (const button of sortHeaders) {
    const active = button.dataset.catalogSort === sortKey;
    const heading = button.closest("th");
    if (active) heading.setAttribute("aria-sort", sortDirection === 1 ? "ascending" : "descending");
    else heading.removeAttribute("aria-sort");
    button.querySelector("span").textContent = active ? (sortDirection === 1 ? " ↑" : " ↓") : "";
  }
  page = Math.min(page, Math.max(0, Math.ceil(visible.length / pageSize) - 1));
  const start = page * pageSize;
  const counts = [
    ["Total items", items.length], ["In My Apothecary", owned.size],
    ["Active", items.filter(item => item.is_active).length], ["Matching filters", visible.length]
  ];
  by("counts").replaceChildren(...counts.map(([label, count]) => {
    const badge = element("span", "");
    badge.className = "catalog-pill";
    if (label === "Matching filters") badge.textContent = label + " " + count;
    else {
      const caption = element("span", label);
      caption.className = "section-kicker";
      badge.append(caption, document.createTextNode(String(count)));
    }
    return badge;
  }));
  by("catalog").replaceChildren();
  for (const item of visible.slice(start, start + pageSize)) {
    const row = document.createElement("tr");
    const name = document.createElement("td");
    const toggle = element("button", "+ " + item.name);
    toggle.title = "Expand or collapse the ingredient details";
    toggle.type = "button";
    toggle.className = "font-semibold";
    toggle.setAttribute("aria-expanded", "false");
    const detailRow = document.createElement("tr");
    detailRow.className = "detail-row";
    detailRow.hidden = true;
    const detailCell = document.createElement("td");
    detailCell.colSpan = 5;
    const panel = document.createElement("div");
    panel.className = "detail-panel";
    detailCell.append(panel);
    detailRow.append(detailCell);
    toggle.onclick = () => {
      detailRow.hidden = !detailRow.hidden;
      toggle.setAttribute("aria-expanded", String(!detailRow.hidden));
      toggle.textContent = (detailRow.hidden ? "+ " : "− ") + item.name;
      if (!detailRow.hidden) void viewItem(item, panel);
    };
    if (admin && bulkMode) {
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = selected.has(item.id);
      checkbox.setAttribute("aria-label", "Select " + item.name);
      checkbox.onchange = () => checkbox.checked ? selected.add(item.id) : selected.delete(item.id);
      name.append(checkbox);
    }
    name.append(toggle);
    const inInventory = owned.has(item.id);
    const retired = owned.get(item.id) === false;
    row.append(name, element("td", item.category ?? "—"), element("td", item.form ?? "—"), element("td", retired ? "Retired" : inInventory ? "Yes" : "No"));
    const actions = document.createElement("td");
    const view = element("button", "View");
    view.title = "Show or hide ingredient values and notes below this row";
    view.type = "button";
    view.className = "btn btn-ghost";
    view.onclick = () => toggle.click();
    const add = element("button", inInventory ? "In My Apothecary" : "Add to My Apothecary");
    add.type = "button";
    add.className = "btn btn-ghost";
    add.disabled = inInventory || !item.is_active;
    add.title = inInventory ? "Already in your inventory" : !item.is_active
      ? "Inactive catalog items cannot be added" : "Enter purchase details and add this item to your inventory";
    add.onclick = () => openHandoff(item);
    if (retired) {
      const restore = element("a", "View Retired Item");
      restore.href = "/my-apothecary?retired=" + encodeURIComponent(item.name);
      restore.className = "btn btn-ghost";
      restore.title = "Open My Apothecary to restore this ingredient";
      actions.append(restore, view);
    } else {
      actions.append(add, view);
    }
    if (admin) {
      const modify = element("button", "Edit");
    modify.title = "Edit this shared catalog entry";
      modify.type = "button";
      modify.className = "btn btn-ghost";
      modify.onclick = () => edit([item.id]);
      actions.append(modify);
    }
    row.append(actions);
    by("catalog").append(row, detailRow);
  }
  by("catalog-note").textContent = visible.length
    ? "Showing " + (start + 1) + "–" + Math.min(start + pageSize, visible.length) + " of " + visible.length
    : "No matching ingredients.";
  by("previous").disabled = page === 0;
  by("next").disabled = start + pageSize >= visible.length;
}

async function catalog() {
  const request = ++revision;
  tell("Loading the Apothecary Catalog…");
  try {
    const [catalogRows, inventoryRows] = await Promise.all([
      readPages("master_items", "id,name,category,form,item_class,is_active,density_g_per_ml", "id"),
      readPages("inventory_items", "master_item_id,is_active", "master_item_id")
    ]);
    if (request !== revision || by("workspace").hidden) return;
    items = catalogRows.sort((a, b) => a.name.localeCompare(b.name));
    owned = new Map(inventoryRows.map(row => [row.master_item_id, row.is_active]));
    render();
    tell("");
  } catch {
    if (request === revision) tell("Could not load the Apothecary Catalog and your inventory status.");
  }
}

let handoffItem = null;
let handoffSaving = false;
const handoff = by("inventory-handoff");
const handoffForm = by("handoff-form");

handoffForm.elements.purchase_unit.replaceChildren(new Option("Choose a unit", ""), ...Object.entries(purchaseUnitLabels).map(([unit, label]) => new Option(label, unit)));

function previewHandoffCost() {
  if (!handoffItem) return;
  const fields = new FormData(handoffForm);
  by("handoff-pricing").textContent = purchaseCostSummary({
    purchase_total_cost: fields.get("purchase_total_cost"),
    purchase_quantity: fields.get("purchase_quantity"),
    purchase_unit: fields.get("purchase_unit"),
    master_items: handoffItem
  });
}

handoffForm.addEventListener("input", previewHandoffCost);

function openHandoff(item) {
  handoffItem = item;
  handoffForm.reset();
  by("handoff-status").textContent = "";
  by("handoff-title").textContent = item.name;
  previewHandoffCost();
  handoff.showModal();
}

by("handoff-cancel").onclick = () => { if (!handoffSaving) handoff.close(); };
handoff.addEventListener("cancel", event => { if (handoffSaving) event.preventDefault(); });
handoffForm.onsubmit = async event => {
  event.preventDefault();
  if (handoffSaving || !handoffItem) return;
  const item = handoffItem;
  const fields = new FormData(handoffForm);
  const quantity = fields.get("purchase_quantity");
  const unit = fields.get("purchase_unit");
  if (Boolean(quantity) !== Boolean(unit)) {
    by("handoff-status").textContent = "Enter both a purchase amount and unit, or leave both blank.";
    return;
  }
  const submit = handoffForm.querySelector('[type="submit"]');
  const request = revision;
  handoffSaving = submit.disabled = true;
  try {
    const { error } = await db.from("inventory_items").upsert({
      master_item_id: item.id,
      supplier: fields.get("supplier").trim() || null,
      manufacturer: fields.get("manufacturer").trim() || null,
      purchase_total_cost: fields.get("purchase_total_cost") || null,
      purchase_quantity: quantity || null,
      purchase_unit: unit || null,
      markup_percent: fields.get("markup_percent") || 0
    }, { onConflict: "owner_id,master_item_id", ignoreDuplicates: true });
    if (request !== revision || !handoff.open) return;
    if (error) throw error;
    const { data: saved, error: readError } = await db.from("inventory_items")
      .select("is_active").eq("master_item_id", item.id).single();
    if (request !== revision || !handoff.open) return;
    if (readError || !saved) {
      by("handoff-status").textContent = "Could not confirm inventory status. Try again or refresh the catalog.";
      return;
    }
    owned.set(item.id, saved.is_active);
    handoff.close();
    render();
    tell(saved.is_active
      ? "Ingredient is in My Apothecary."
      : "This ingredient is retired. Use View Retired Item to restore it in My Apothecary.");
  } catch {
    if (request === revision && handoff.open) by("handoff-status").textContent = "Could not add the ingredient. Try again.";
  } finally {
    handoffSaving = submit.disabled = false;
  }
};


function show(session) {
  by("counts").hidden = !session;
  if (!session) handoff.close();
  admin = session?.user.app_metadata?.catalog_admin === true;
  by("catalog-admin").hidden = !admin;
  if (!session) { bulkMode = false; selected.clear(); by("editor").close(); }

  by("workspace").hidden = !session;
  if (session) { tell(""); void catalog(); }
  else { ++revision; items = []; owned.clear(); render(); tell("Sign in to view the catalog and your inventory."); }
}


const filter = () => { page = 0; render(); };
by("search").addEventListener("input", filter);
for (const id of ["category", "form", "stock-only"]) by(id).addEventListener("change", filter);
by("clear").onclick = () => {
  for (const id of ["search", "category", "form"]) by(id).value = "";
  by("stock-only").checked = false;
  filter();
};
by("refresh").onclick = catalog;
by("previous").onclick = () => { page--; render(); };
by("next").onclick = () => { page++; render(); };
db.auth.onAuthStateChange((event, session) => {
  if (["INITIAL_SESSION", "SIGNED_IN", "SIGNED_OUT", "USER_UPDATED"].includes(event)) setTimeout(() => show(session), 0);
});
</script>
</body>

<!doctype html>
<html lang="en" data-theme="brenda">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Items | The Hidden Grimoire</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/css/app.css">
<style>
    .grimoire-nav { display:flex; flex-wrap:wrap; gap:.25rem .75rem; }
    .grimoire-nav a { padding:.3rem .5rem; text-decoration:underline; text-underline-offset:.2em; }
    .grimoire-sidebar-nav { flex-direction:column; }
    .grimoire-sidebar-nav a { display:block; border-radius:.85rem; }
    .grimoire-nav a[aria-current='page'] { background:#efe4d0; color:#355846; }
    .grimoire-mobile { display:flex; }
    .grimoire-logo { width:8rem; }
    @media (min-width:768px) { .grimoire-mobile { display:none; } }
    .catalog-scroll { overflow:auto; border:1px solid #dfcfb0; border-radius:1rem; }
    .catalog-grid { width:100%; min-width:42rem; }
    .catalog-grid th { background:#efe4d0; text-transform:uppercase; letter-spacing:.12em; }
    .catalog-grid tbody tr:nth-child(even) { background:#efe4d04d; }
    .catalog-grid :is(th, td) { padding:.65rem .85rem; vertical-align:top; }
    .catalog-grid summary { cursor:pointer; font-weight:600; }
    .catalog-grid td:last-child { white-space:nowrap; }
    .item-facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(12rem,1fr)); gap:.75rem; margin-top:1rem; }
    .item-facts dt { font-weight:600; }
    .item-facts dd { margin:0; overflow-wrap:anywhere; white-space:pre-wrap; }
    .catalog-grid .detail-row td { white-space:normal; background:transparent; }
    .detail-panel { background:#efe4d0; border:1px solid #dfcfb0; border-radius:1rem; padding:1rem; }
    .detail-panel .item-facts { grid-template-columns:repeat(2,minmax(0,1fr)); }
    @media(max-width:650px) { .detail-panel .item-facts { grid-template-columns:1fr; } }
      .compact-values { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.75rem 1.25rem; }
    .compact-values p { margin:0 0 .35rem; overflow-wrap:anywhere; }
    .compact-values strong, .compact-footer strong { color:#2b241d; }
    .compact-values, .compact-footer { color:#4a5145; }
    .compact-block + .compact-block, .compact-footer { border-top:1px solid #dfcfb0; margin-top:.65rem; padding-top:.65rem; }
    .compact-footer { display:flex; flex-wrap:wrap; gap:.25rem 1rem; font-size:.9rem; }
    @media(max-width:650px) { .compact-values { grid-template-columns:1fr; } }
  </style>
</head>
<body class="app-shell antialiased">
<div class="workspace-frame">
<aside class="workspace-sidebar surface-panel p-5">
      <div class="sidebar-brand">
        <img class="sidebar-brand-logo grimoire-logo" src="/static/img/brand/site-logo.jpg" width="400" height="400" alt="">
        <p class="section-kicker">The Hidden Grimoire</p>
      </div>
      <nav class="grimoire-nav grimoire-sidebar-nav py-4" aria-label="Workspace">
        <a href="/">Overview</a>
        <a href="/stores.html">Inventory</a>
        <a href="/master-items.html" aria-current="page">Master Items</a>
        <a href="/#leaves">Tea recipes</a>
        <a href="/#calculus">Soap calculator</a>
      </nav>
      <div class="sidebar-art-shell">
        <img class="sidebar-art-image" src="/static/img/brand/sidebar-art.jpg" width="400" height="400" alt="" decoding="async">
      </div>
    </aside>
<main class="workspace-main">
  <header class="surface-panel px-5 py-4">
    <p class="section-kicker">The Living Grimoire</p>
    <p class="text-xl font-semibold">Master Items</p>
    <nav class="grimoire-nav grimoire-mobile" aria-label="Workspace">
          <a href="/">Overview</a><a href="/stores.html">Inventory</a><a href="/master-items.html" aria-current="page">Master Items</a>
          <a href="/#leaves">Tea recipes</a><a href="/#calculus">Soap calculator</a>
        </nav>
  </header>
  <section class="surface-panel p-6">
    <p class="section-kicker">Master Catalog</p>
    <h1 class="dashboard-title mt-2">The wider materia catalog.</h1>
    <p id="status" role="status">Connecting…</p>
    <form id="login" class="space-y-4 mt-4" hidden>
      <label>Email <input name="email" class="input input-bordered" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" class="input input-bordered" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary">Sign in</button>
    </form>
    <div id="workspace" hidden>
      <button id="logout" type="button" class="btn btn-ghost">Sign out</button>
      <div id="counts" class="flex flex-wrap gap-3 mt-4" aria-live="polite"></div>
      <div class="flex flex-wrap items-center gap-3 mt-4">
        <label>Search <input id="search" type="search" class="input input-bordered" placeholder="Search the catalog…"></label>
        <label>Category <select id="category" class="select select-bordered"></select></label>
        <label>Form <select id="form" class="select select-bordered"></select></label>
        <label><input id="stock-only" type="checkbox" class="checkbox checkbox-sm"> In inventory only</label>
        <button id="clear" type="button" class="btn btn-ghost">Lift Filters</button>
        <button id="refresh" type="button" class="btn btn-ghost">Refresh</button>
      </div>
      <div id="catalog-admin" class="flex flex-wrap gap-3 mt-4" hidden>
        <button id="new-item" type="button" class="btn btn-primary">Add to the Catalog</button>
        <button id="bulk-edit" type="button" class="btn btn-ghost">Bulk Edit Selected</button>
      </div>
      <dialog id="editor" class="surface-panel p-6" style="margin:auto;max-width:min(92vw,34rem)">
        <form id="edit-form" class="space-y-4">
          <h2 id="edit-title" class="text-2xl">Catalog item</h2>
          <label id="name-field">Name <input name="name" class="input input-bordered" maxlength="255"></label>
          <label>Class <input name="item_class" class="input input-bordered" maxlength="50"></label>
          <label>Category <input name="category" class="input input-bordered" maxlength="50"></label>
          <label>Form <input name="form" class="input input-bordered" maxlength="50"></label>
          <p id="edit-status" role="status"></p>
          <button class="btn btn-primary">Save</button>
          <button id="close-editor" type="button" class="btn btn-ghost">Cancel</button>
        </form>
      </dialog>
      <div class="catalog-scroll mt-4">
        <table class="table catalog-grid">
          <thead><tr><th scope="col">Name</th><th scope="col">Category</th><th scope="col">Form</th><th scope="col">Inventory</th><th scope="col">Actions</th></tr></thead>
          <tbody id="catalog"></tbody>
        </table>
      </div>
      <p id="catalog-note" class="mt-4"></p>
      <div class="flex items-center gap-3 mt-4">
        <button id="previous" type="button" class="btn btn-ghost">Previous</button>
        <button id="next" type="button" class="btn btn-ghost">Next</button>
      </div>
    </div>
  </section>
</main>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";
const db = createClient("https://dfuanosyewsimvhdparf.supabase.co", "sb_publishable_biDbT_ZmXynIVLrgukrz5g_ZBTk84T7");
const by = id => document.getElementById(id);
const tell = message => { by("status").textContent = message; };
let revision = 0;
const element = (tag, value) => { const item = document.createElement(tag); item.textContent = value; return item; };

const pageSize = 50;
async function viewItem(item, panel) {
  panel.textContent = "Loading item details…";
  const { data, error } = await db.from("master_items").select("*").eq("id", item.id).single();
  if (!panel.isConnected) return;
  if (error) { panel.textContent = "Could not load item details."; return; }
  panel.replaceChildren();
  const { metadata, ...core } = data;
  const d = { ...metadata, ...core };
  const format = value => {
    if (value == null || (typeof value === "string" && !value.trim())) return "";
    if (typeof value === "boolean") return value ? "Yes" : "No";
    if (Array.isArray(value)) return value.map(format).filter(Boolean).join(", ");
    if (typeof value === "object") return Object.entries(value).map(([key, entry]) => label(key.replaceAll("_", " "), entry)).filter(Boolean).join(" · ");
    return String(value);
  };
  const label = (name, value) => {
    const formatted = format(value);
    return formatted === "" ? "" : name + " " + formatted;
  };
  const append = (parent, tag, fields) => {
    for (const [name, value] of fields) {
      const formatted = format(value);
      if (formatted === "") continue;
      const line = document.createElement(tag);
      line.append(element("strong", name + ": "), document.createTextNode(formatted));
      parent.append(line);
    }
  };
  const join = (...values) => values.filter(Boolean).join(" · ");
  const percent = value => format(value) === "" ? "" : format(value) + "%";
  const acids = ["Lauric", "Myristic", "Palmitic", "Stearic", "Ricinoleic", "Oleic", "Linoleic", "Linolenic"];
  const grid = document.createElement("div");
  grid.className = "compact-values";
  const left = document.createElement("div");
  const right = document.createElement("div");
  function block(column, fields) {
    const group = document.createElement("div");
    group.className = "compact-block";
    append(group, "p", fields);
    if (group.childElementCount) column.append(group);
  }
  block(left, [
    ["Common names", d.common_names], ["Scientific name", d.scientific_name], ["Good for", d.therapeutic_tags],
    ["Taste profile", d.taste_profile], ["Caffeine level", d.caffeine_level], ["Skin feel", d.skin_feel],
    ["Allergen flags", d.allergen_flags], ["Drug interactions", d.drug_interactions],
    ["Use flags", join(label("Skin-safe", d.skin_safe), label("Lip-safe", d.lip_safe), label("Food grade", d.food_grade))]
  ]);
  const density = join(label("source:", d.density_source), label("confidence:", d.density_confidence));
  block(left, [
    ["SAP values", join(label("NaOH", d.sap_naoh), label("KOH", d.sap_koh))],
    ["SAP source", d.sap_source],
    ["Fatty acids %", acids.map(name => label(name, percent(d["fa_" + name.toLowerCase()]))).filter(Boolean).join(", ")],
    ["Iodine value", d.iodine_value], ["Usage range", [percent(d.usage_rate_min), percent(d.usage_rate_max)].filter(Boolean).join("–")],
    ["Density (g/mL)", format(d.density_g_per_ml) && format(d.density_g_per_ml) + (density ? " (" + density + ")" : "")],
    ["Usage context", d.usage_context], ["Evidence tier", d.evidence_tier]
  ]);
  block(right, [
    ["Traditional use", d.traditional_use], ["Safety notes", d.safety_notes], ["Contraindications", d.contraindications],
    ["Regulatory notes", d.regulatory_notes], ["Pregnancy/lactation", d.pregnancy_lactation_notes],
    ["Confidence reason", d.confidence_reason], ["Notes", d.notes]
  ]);
  block(right, [["Colorant profile", d.colorant_profile], ["Colorant source", d.colorant_profile_source_url], ["Image source", d.image_source]]);
  if (left.childElementCount) grid.append(left);
  if (right.childElementCount) grid.append(right);
  if (grid.childElementCount === 1) grid.style.gridTemplateColumns = "1fr";
  const footer = document.createElement("div");
  footer.className = "compact-footer";
  const date = value => value?.slice(0, 10);
  append(footer, "span", [["Unknown fields", d.unknown_fields], ["Confidence", d.confidence], ["Source", d.source],
    ["Last refresh", date(d.metadata_updated_at)], ["Created", date(d.created_at)], ["ID", d.id]]);
  if (grid.childElementCount) panel.append(grid);
  if (footer.childElementCount) panel.append(footer);
}
let items = [];
let owned = new Set();
let page = 0;
let admin = false;
let editIds = [];
const selected = new Set();

function edit(ids = []) {
  if (!admin) return;
  const form = by("edit-form");
  const item = ids.length === 1 ? items.find(row => row.id === ids[0]) : null;
  editIds = ids;
  form.reset();
  const bulk = ids.length > 1;
  by("edit-title").textContent = bulk ? "Edit " + ids.length + " selected items" : item ? "Edit catalog item" : "Add to the Catalog";
  by("name-field").hidden = bulk;
  form.elements.name.required = !bulk;
  for (const name of ["name", "item_class", "category", "form"]) form.elements[name].value = item?.[name] ?? "";
  by("edit-status").textContent = bulk ? "Blank fields leave existing values in place." : "";
  by("editor").showModal();
}

by("new-item").onclick = () => edit();
by("bulk-edit").onclick = () => {
  if (selected.size) edit([...selected]);
  else tell("Select at least one catalog item.");
};
by("close-editor").onclick = () => by("editor").close();
by("edit-form").onsubmit = async event => {
  event.preventDefault();
  if (!admin) return;
  const form = event.currentTarget;
  const submit = form.querySelector("button");
  const bulk = editIds.length > 1;
  const values = {};
  for (const [field, raw] of new FormData(form)) {
    const value = raw.trim();
    if (bulk && (field === "name" || !value)) continue;
    values[field] = value || (field === "item_class" ? "Other" : null);
  }
  if ((!bulk && !values.name) || !Object.keys(values).length) {
    by("edit-status").textContent = bulk ? "Enter at least one change." : "Enter a name.";
    return;
  }
  submit.disabled = true;
  const query = editIds.length
    ? db.from("master_items").update(values).in("id", editIds)
    : db.from("master_items").insert(values);
  const { data, error } = await query.select("id");
  submit.disabled = false;
  if (error || data?.length !== (editIds.length || 1)) {
    by("edit-status").textContent = "Could not save the catalog changes. Check access and item names.";
    return;
  }
  by("editor").close();
  selected.clear();
  await catalog();
};

async function readPages(table, fields, order) {
  const rows = [];
  const chunk = 250;
  for (let offset = 0; ; offset += chunk) {
    const { data, error } = await db.from(table).select(fields).order(order).range(offset, offset + chunk - 1);
    if (error) throw error;
    rows.push(...data);
    if (data.length < chunk) return rows;
  }
}

function choices(select, values, label) {
  const selected = select.value;
  const list = [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b));
  select.replaceChildren(new Option(label, ""), ...list.map(value => new Option(value, value)));
  if (list.includes(selected)) select.value = selected;
}

function render() {
  const category = by("category");
  const form = by("form");
  const term = by("search").value.trim().toLowerCase();
  choices(category, items.map(item => item.category), "All categories");
  const categoryItems = items.filter(item => !category.value || item.category === category.value);
  choices(form, category.value ? categoryItems.map(item => item.form) : [], category.value ? "All forms" : "Choose category first");
  form.disabled = !category.value;
  const visible = categoryItems.filter(item =>
    (!form.value || item.form === form.value) &&
    (!by("stock-only").checked || owned.has(item.id)) &&
    [item.name, item.category, item.form].some(value => value?.toLowerCase().includes(term))
  );
  page = Math.min(page, Math.max(0, Math.ceil(visible.length / pageSize) - 1));
  const start = page * pageSize;
  const counts = [
    ["Rows", items.length], ["In Inventory", owned.size],
    ["Active", items.filter(item => item.is_active).length], ["Visible", visible.length]
  ];
  by("counts").replaceChildren(...counts.map(([label, count]) => {
    const badge = element("span", label + " " + count);
    badge.className = "badge badge-outline";
    return badge;
  }));
  by("catalog").replaceChildren();
  for (const item of visible.slice(start, start + pageSize)) {
    const row = document.createElement("tr");
    const name = document.createElement("td");
    const toggle = element("button", "+ " + item.name);
    toggle.type = "button";
    toggle.className = "font-semibold";
    toggle.setAttribute("aria-expanded", "false");
    const detailRow = document.createElement("tr");
    detailRow.className = "detail-row";
    detailRow.hidden = true;
    const detailCell = document.createElement("td");
    detailCell.colSpan = 5;
    const panel = document.createElement("div");
    panel.className = "detail-panel";
    detailCell.append(panel);
    detailRow.append(detailCell);
    toggle.onclick = () => {
      detailRow.hidden = !detailRow.hidden;
      toggle.setAttribute("aria-expanded", String(!detailRow.hidden));
      toggle.textContent = (detailRow.hidden ? "+ " : "− ") + item.name;
      if (!detailRow.hidden) void viewItem(item, panel);
    };
    if (admin) {
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = selected.has(item.id);
      checkbox.setAttribute("aria-label", "Select " + item.name);
      checkbox.onchange = () => checkbox.checked ? selected.add(item.id) : selected.delete(item.id);
      name.append(checkbox);
    }
    name.append(toggle);
    const inInventory = owned.has(item.id);
    row.append(name, element("td", item.category ?? "—"), element("td", item.form ?? "—"), element("td", inInventory ? "Yes" : "No"));
    const actions = document.createElement("td");
    const view = element("button", "View");
    view.type = "button";
    view.className = "btn btn-ghost";
    view.onclick = () => toggle.click();
    const add = element("button", "Inventory");
    add.type = "button";
    add.className = "btn btn-ghost";
    add.disabled = inInventory || !item.is_active;
    add.onclick = async () => {
      const request = revision;
      add.disabled = true;
      const { error } = await db.from("inventory_items").upsert(
        { master_item_id: item.id }, { onConflict: "owner_id,master_item_id", ignoreDuplicates: true }
      );
      if (request !== revision || by("workspace").hidden) return;
      if (error) { add.disabled = false; return tell("Could not add the ingredient."); }
      owned.add(item.id);
      render();
      tell("Ingredient is in your inventory.");
    };
    actions.append(add, view);
    if (admin) {
      const modify = element("button", "Edit");
      modify.type = "button";
      modify.className = "btn btn-ghost";
      modify.onclick = () => edit([item.id]);
      actions.append(modify);
    }
    row.append(actions);
    by("catalog").append(row, detailRow);
  }
  by("catalog-note").textContent = visible.length
    ? "Showing " + (start + 1) + "–" + Math.min(start + pageSize, visible.length) + " of " + visible.length
    : "No matching ingredients.";
  by("previous").disabled = page === 0;
  by("next").disabled = start + pageSize >= visible.length;
}

async function catalog() {
  const request = ++revision;
  tell("Loading Master Items…");
  try {
    const [catalogRows, inventoryRows] = await Promise.all([
      readPages("master_items", "id,name,category,form,item_class,is_active", "id"),
      readPages("inventory_items", "master_item_id", "master_item_id")
    ]);
    if (request !== revision || by("workspace").hidden) return;
    items = catalogRows.sort((a, b) => a.name.localeCompare(b.name));
    owned = new Set(inventoryRows.map(row => row.master_item_id));
    render();
    tell("Loaded " + items.length + " master items.");
  } catch {
    if (request === revision) tell("Could not load Master Items and inventory status.");
  }
}

function show(session) {
  admin = session?.user.app_metadata?.catalog_admin === true;
  by("catalog-admin").hidden = !admin;
  if (!session) { selected.clear(); by("editor").close(); }
  by("login").hidden = Boolean(session);
  by("workspace").hidden = !session;
  if (session) { tell(""); void catalog(); }
  else { ++revision; items = []; owned.clear(); render(); tell("Sign in to view the catalog and your inventory."); }
}

by("login").onsubmit = async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const fields = new FormData(form);
  const button = form.querySelector("button");
  button.disabled = true;
  const { error } = await db.auth.signInWithPassword({ email: fields.get("email"), password: fields.get("password") });
  button.disabled = false;
  form.reset();
  if (error) tell("Sign-in failed. Check your email and password.");
};
by("logout").onclick = async () => { const { error } = await db.auth.signOut(); if (error) tell("Could not sign out."); };
const filter = () => { page = 0; render(); };
by("search").addEventListener("input", filter);
for (const id of ["category", "form", "stock-only"]) by(id).addEventListener("change", filter);
by("clear").onclick = () => {
  for (const id of ["search", "category", "form"]) by(id).value = "";
  by("stock-only").checked = false;
  filter();
};
by("refresh").onclick = catalog;
by("previous").onclick = () => { page--; render(); };
by("next").onclick = () => { page++; render(); };
db.auth.onAuthStateChange((event, session) => {
  if (["INITIAL_SESSION", "SIGNED_IN", "SIGNED_OUT"].includes(event)) setTimeout(() => show(session), 0);
});
</script>
</body>
</html>

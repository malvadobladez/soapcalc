<!doctype html>
<html lang="en" data-theme="brenda">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Apothecary | The Hidden Grimoire</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/grimoire-account.css">
<link rel="stylesheet" href="/static/css/apothecary-table.css?v=shared-toolbar">
<style>
    .grimoire-nav { display:flex; flex-wrap:wrap; gap:.25rem .75rem; }
    .grimoire-nav a { padding:.3rem .5rem; text-decoration:underline; text-underline-offset:.2em; }
    .grimoire-sidebar-nav { flex-direction:column; }
    .grimoire-sidebar-nav a { display:block; border-radius:.85rem; }
    .grimoire-nav a[aria-current='page'] { background:#efe4d0; color:#355846; }
    .grimoire-mobile { display:flex; }
    .grimoire-logo { width:8rem; }
    @media (min-width:768px) { .grimoire-mobile { display:none; } }
  </style>
  <script defer src="/static/js/grimoire-nav.js"></script>
</head>
<body class="app-shell antialiased">
<div class="workspace-frame">
<aside class="workspace-sidebar surface-panel p-5">
      <div class="sidebar-brand">
        <img class="sidebar-brand-logo grimoire-logo" src="/static/img/brand/site-logo.jpg" width="400" height="400" alt="">
        <p class="section-kicker">The Hidden Grimoire</p>
      </div>
      <nav class="grimoire-nav grimoire-sidebar-nav py-4" aria-label="Workspace" data-grimoire-nav="/my-apothecary"></nav>
      <div class="sidebar-art-shell">
        <img class="sidebar-art-image" src="/static/img/brand/sidebar-art.jpg" width="400" height="400" alt="" decoding="async">
      </div>
    </aside>
<main class="workspace-main">
  <header class="surface-panel px-5 py-4" data-grimoire-header="My Apothecary">
    <nav class="grimoire-nav grimoire-mobile" aria-label="Workspace" data-grimoire-nav="/my-apothecary"></nav>
  </header>
  <section class="surface-panel p-6">
    <p class="section-kicker">Personal Inventory</p>
    <h1 class="dashboard-title mt-2">My Apothecary</h1>
    <p class="mt-2 text-neutral/75">Keep track of the oils, herbs, scents, and other materials on your shelves. Open an ingredient to see its properties, or edit its stock, supplier, and costs.</p>
    <p id="status" role="status">Connecting…</p>

    <div id="workspace" hidden>
      <div class="catalog-toolbar">
        <input id="stock-search" type="search" class="input input-bordered bg-base-100" aria-label="Search My Apothecary" placeholder="Search My Apothecary…">
        <select id="stock-category" class="select select-bordered bg-base-100" aria-label="Category"></select>
        <select id="stock-form" class="select select-bordered bg-base-100" aria-label="Form"></select>
        <label class="catalog-stock"><input id="show-retired" type="checkbox" class="checkbox checkbox-sm"> Show retired items</label>
        <a href="/apothecary-catalog" class="btn btn-primary rounded-full" title="Browse the catalog and add ingredients to My Apothecary">Browse Apothecary Catalog</a>
      </div>
      <p id="stock-empty" class="mt-4" hidden>Your inventory is empty.</p>
      <div class="catalog-scroll mt-4"><table class="table catalog-grid">
        <thead><tr>
          <th scope="col"><button type="button" data-sort="name" title="Sort by ingredient">Ingredient</button></th>
          <th scope="col"><button type="button" data-sort="in_stock" title="Sort by stock status">In Stock</button></th>
          <th scope="col"><button type="button" data-sort="stock_quantity" title="Sort by quantity">Quantity</button></th>
          <th scope="col"><button type="button" data-sort="supplier" title="Sort by supplier">Supplier</button></th>
          <th scope="col"><button type="button" data-sort="cost" title="Sort by cost per base unit">Cost</button></th>
          <th scope="col">Actions</th>
        </tr></thead>
        <tbody id="stock"></tbody>
      </table></div>
      <dialog id="stock-editor" class="surface-panel p-6" style="margin:auto;width:min(92vw,46rem);max-height:88vh;overflow:auto" aria-labelledby="stock-editor-title"></dialog>
    </div>
  </section>
</main>
</div>
<script data-cfasync="false" type="module">
import { db } from "/static/js/grimoire-account.js?v=floating-chat-1";
import { viewItem } from "/static/js/ingredient-details.js";
const by = id => document.getElementById(id);
const tell = message => { by("status").textContent = message; };
const element = (tag, value) => { const item = document.createElement(tag); item.textContent = value; return item; };

let inventoryRows = [];
let sortKey = "name";
let direction = 1;
let loadVersion = 0;
const editor = by("stock-editor");
editor.addEventListener("cancel", event => {
  if (editor.querySelector("button:disabled")) event.preventDefault();
});
const headers = [...document.querySelectorAll("[data-sort]")];

function sortInventory() {
  const category = by("stock-category");
  const form = by("stock-form");
  const options = (select, values, title) => {
    const current = select.value;
    const known = [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b));
    select.replaceChildren(new Option(title, ""), ...known.map(value => new Option(value, value)));
    select.value = known.includes(current) ? current : "";
  };
  options(category, inventoryRows.map(({ item }) => item.master_items?.category), "All categories");
  const inCategory = item => !category.value || item.master_items?.category === category.value;
  options(form, inventoryRows.filter(({ item }) => inCategory(item)).map(({ item }) => item.master_items?.form), "All forms");
  const term = by("stock-search").value.trim().toLowerCase();
  let visible = 0;
  const value = item => sortKey === "name" ? item.master_items?.name : sortKey === "cost" ? unitPrices(item)?.cost : item[sortKey];
  inventoryRows.sort(({ item: left }, { item: right }) => {
    const a = value(left);
    const b = value(right);
    if (a == null || b == null) return Number(a == null) - Number(b == null);
    const comparison = ["name", "supplier"].includes(sortKey) ? a.localeCompare(b) : Number(a) - Number(b);
    return direction * comparison || left.master_item_id - right.master_item_id;
  });
  for (const { row, item, detailRow, toggle } of inventoryRows) {
    row.hidden = (!item.is_active && !by("show-retired").checked) || !inCategory(item) || (Boolean(form.value) && item.master_items?.form !== form.value) ||
      ![item.master_items?.name, item.supplier, item.manufacturer].some(value => (value ?? "").toLowerCase().includes(term));
    if (!row.hidden) visible++;
    detailRow.hidden = row.hidden || toggle.getAttribute("aria-expanded") !== "true";
    by("stock").append(row, detailRow);
  }
  by("stock-empty").textContent = inventoryRows.length ? "No matching inventory items." : "Your inventory is empty.";
  by("stock-empty").hidden = visible > 0;
  for (const button of headers) {
    const header = button.closest("th");
    if (button.dataset.sort === sortKey) header.setAttribute("aria-sort", direction === 1 ? "ascending" : "descending");
    else header.removeAttribute("aria-sort");
  }
}

for (const button of headers) button.onclick = () => {
  direction = sortKey === button.dataset.sort ? -direction : 1;
  sortKey = button.dataset.sort;
  sortInventory();
};

by("stock-search").addEventListener("input", sortInventory);
by("stock-category").addEventListener("change", () => {
  by("stock-form").value = "";
  sortInventory();
});
by("stock-form").addEventListener("change", sortInventory);
by("show-retired").addEventListener("change", sortInventory);

const purchaseUnits = {
  g: [1, "g"], kg: [1000, "g"], lb: [453.592, "g"], oz: [28.3495, "g"],
  ml: [1, "mL"], l: [1000, "mL"], "fl oz": [29.5735295625, "mL"],
  each: [1, "each"], unit: [1, "each"], piece: [1, "each"], pcs: [1, "each"]
};

function unitPrices(item) {
  const unit = item.purchase_unit ? purchaseUnits[item.purchase_unit] : purchaseUnits.g;
  const quantity = Number(item.purchase_unit ? item.purchase_quantity : item.purchase_weight_grams);
  if (!unit || !(quantity > 0) || item.purchase_total_cost == null) return null;
  const [factor, base] = unit;
  const cost = Number((Number(item.purchase_total_cost) / (quantity * factor)).toFixed(6));
  const density = Number(item.master_items?.density_g_per_ml);
  const perGram = base === "g" ? cost : base === "mL" && density > 0 ? Number((cost / density).toFixed(6)) : null;
  return { cost, base, perGram, retail: cost * (1 + Number(item.markup_percent ?? 0) / 100) };
}

function displayUnitCost(item, cell, retailCell) {
  const price = unitPrices(item);
  item.cost_per_gram = price?.perGram ?? null;
  cell.textContent = price ? price.cost.toFixed(6) + " / " + price.base : "—";
  if (price?.base === "mL" && price.perGram != null) cell.title = price.perGram.toFixed(6) + " / g";
  else cell.removeAttribute("title");
  retailCell.textContent = price ? price.retail.toFixed(6) + " / " + price.base : "—";
}

async function inventory() {
  const version = ++loadVersion;
  const { data, error } = await db.from("inventory_items")
    .select("owner_id,master_item_id,is_active,in_stock,purchase_total_cost,purchase_weight_grams,supplier,manufacturer,stock_quantity,stock_unit,purchase_quantity,purchase_unit,markup_percent,master_items(name,category,form,density_g_per_ml)")
    .order("master_item_id");
  if (version !== loadVersion || by("workspace").hidden) return;
  by("stock").replaceChildren();
  if (error) return tell("Could not load your inventory.");
  inventoryRows = [];
  by("stock-empty").hidden = Boolean(data.length);
  for (const item of data) {
    const row = document.createElement("tr");
    const form = document.createElement("form");
    const fields = document.createElement("div");
    fields.className = "grid gap-3 sm:grid-cols-2 mt-4";
    form.append(fields);
    const stock = element("td", "");
    const count = element("td", "");
    const vendor = element("td", "");
    const price = element("td", "");
    const name = item.master_items?.name ?? "Ingredient";
    const toggle = element("button", "+ " + name);
    toggle.type = "button";
    toggle.className = "font-semibold";
    toggle.title = "Expand or collapse the ingredient details";
    toggle.setAttribute("aria-expanded", "false");
    const detailRow = document.createElement("tr");
    detailRow.className = "detail-row";
    detailRow.hidden = true;
    const detailCell = document.createElement("td");
    detailCell.colSpan = 6;
    const panel = document.createElement("div");
    panel.className = "detail-panel";
    panel.id = "stock-details-" + item.master_item_id;
    panel.setAttribute("aria-live", "polite");
    toggle.setAttribute("aria-controls", panel.id);
    detailCell.append(panel);
    detailRow.append(detailCell);
    toggle.onclick = () => {
      const expanded = detailRow.hidden;
      detailRow.hidden = !expanded;
      toggle.setAttribute("aria-expanded", String(expanded));
      toggle.textContent = (expanded ? "− " : "+ ") + name;
      if (expanded) void viewItem({ id: item.master_item_id }, panel);
    };
    const nameCell = document.createElement("th");
    nameCell.append(toggle);
    row.append(nameCell);
    row.firstElementChild.scope = "row";
    function field(label, name, type, value, step) {
      const cell = element("label", label + " ");
      cell.className = "block";
      const input = document.createElement("input");
      input.name = name;
      input.type = type;
      if (type === "checkbox") input.checked = value;
      else { input.value = value ?? ""; input.step = step; input.min = name === "grams" ? "0.001" : "0"; }
      input.setAttribute("aria-label", label + " for " + (item.master_items?.name ?? "ingredient"));
      input.className = type === "checkbox" ? "checkbox checkbox-sm" : "input input-bordered w-full";
      cell.append(input);
      fields.append(cell);
      return input;
    }
    const stocked = field("In stock", "stocked", "checkbox", item.in_stock);
    const cost = field("Purchase cost", "cost", "number", item.purchase_total_cost, "0.01");
    const grams = field("Purchase weight (g)", "grams", "number", item.purchase_weight_grams, "0.001");
    const supplier = field("Supplier", "supplier", "text", item.supplier);
    supplier.maxLength = 120;
    const manufacturer = field("Manufacturer", "manufacturer", "text", item.manufacturer);
    manufacturer.maxLength = 120;
    const quantity = field("Stock quantity", "quantity", "number", item.stock_quantity, "any");
    const unit = field("Stock unit", "unit", "text", item.stock_unit);
    unit.maxLength = 32;
    const unitCost = document.createElement("td");

    const amount = field("Purchase amount", "purchase_amount", "number", item.purchase_quantity, "0.0001");
    amount.min = "0.0001";
    const unitCell = element("label", "Purchase unit ");
    const purchaseUnit = document.createElement("select");
    purchaseUnit.setAttribute("aria-label", "Purchase unit");
    purchaseUnit.className = "select select-bordered w-full";
    purchaseUnit.replaceChildren(new Option("—", ""), ...Object.keys(purchaseUnits).map(value => new Option(value, value)));
    purchaseUnit.value = item.purchase_unit ?? "";
    unitCell.append(purchaseUnit);
    fields.append(unitCell);
    const markup = field("Markup percent", "markup", "number", item.markup_percent, "0.01");
    markup.max = "99999.99";
    const retail = document.createElement("td");
    const pricing = element("p", "");
    pricing.className = "mt-4";
    form.append(pricing);
    function renderSummary() {
      stock.textContent = item.in_stock ? "Yes" : "No";
      count.textContent = item.stock_quantity == null ? "—" : [item.stock_quantity, item.stock_unit].filter(Boolean).join(" ");
      vendor.textContent = item.supplier ?? "—";
      displayUnitCost(item, unitCost, retail);
      price.textContent = unitCost.textContent;
      price.title = unitCost.title || "Cost per base unit";
      pricing.textContent = "Cost per base unit " + unitCost.textContent + " · Retail per base unit " + retail.textContent;
    }
    renderSummary();
    row.append(stock, count, vendor, price);
    const save = element("button", "Save");
    save.title = "Save changes to this personal inventory item";
    save.className = "btn btn-primary rounded-full";
    const cancel = element("button", "Cancel");
    cancel.type = "button";
    cancel.title = "Close without saving";
    cancel.className = "btn btn-ghost rounded-full";
    cancel.onclick = () => editor.close();
    const feedback = element("p", "");
    feedback.setAttribute("role", "status");
    const controls = document.createElement("div");
    controls.className = "flex gap-2 mt-4";
    controls.append(cancel, save);
    form.append(feedback, controls);
    form.onsubmit = async event => {
      event.preventDefault();
      if (Boolean(quantity.value) !== Boolean(unit.value.trim())) {
        feedback.textContent = "Enter both stock quantity and unit, or leave both blank.";
        return;
      }
      if (Boolean(amount.value) !== Boolean(purchaseUnit.value)) {
        tell("Enter both the purchase amount and its unit, or leave both blank.");
        return;
      }
      const updates = {
        purchase_quantity: amount.value || null, purchase_unit: purchaseUnit.value || null,
        markup_percent: markup.value || 0,
        in_stock: stocked.checked, purchase_total_cost: cost.value || null,
        purchase_weight_grams: grams.value || null, supplier: supplier.value.trim() || null, manufacturer: manufacturer.value.trim() || null,
        stock_quantity: quantity.value || null, stock_unit: unit.value.trim() || null
      };
      save.disabled = cancel.disabled = true;
      const { data, error } = await db.from("inventory_items").update(updates)
        .eq("master_item_id", item.master_item_id).select("master_item_id").single();
      save.disabled = cancel.disabled = false;
      if (!row.isConnected) return;
      if (!error && data) {
        Object.assign(item, updates);
        savedValues = inputs.map(input => input.type === "checkbox" ? input.checked : input.value);
        renderSummary();
        if (editor.contains(form)) editor.close();
        sortInventory();
      }
      if (error || !data) feedback.textContent = "Could not save the inventory item.";
      else tell("Inventory item saved.");
    };
    const actions = document.createElement("td");
    const lifecycle = element("button", item.is_active ? "Retire" : "Restore");
    lifecycle.title = item.is_active ? "Hide this item from the active inventory list" : "Return this item to the active inventory list";
    lifecycle.type = "button";
    lifecycle.className = "btn btn-ghost";
    lifecycle.onclick = async () => {
      const active = !item.is_active;
      lifecycle.disabled = remove.disabled = true;
      const { data, error } = await db.from("inventory_items").update({ is_active: active })
        .eq("master_item_id", item.master_item_id).eq("is_active", item.is_active)
        .select("is_active").maybeSingle();
      lifecycle.disabled = remove.disabled = false;
      if (!row.isConnected) return;
      if (error || !data) {
        tell("Could not change item status. Reload Inventory and try again.");
        return;
      }
      item.is_active = data.is_active;
      lifecycle.textContent = item.is_active ? "Retire" : "Restore";
      lifecycle.title = item.is_active ? "Hide this item from the active inventory list" : "Return this item to the active inventory list";
      stockStatus.textContent = item.is_active ? "" : "Retired";
      sortInventory();
      tell(item.is_active ? "Inventory item restored." : "Inventory item retired.");
    };
    const stockStatus = element("span", item.is_active ? "" : "Retired");
    stockStatus.className = "block text-sm";
    row.firstElementChild.append(stockStatus);
    const edit = element("button", "Edit");
    edit.type = "button";
    edit.className = "btn btn-ghost rounded-full";
    edit.title = "Edit stock, purchasing details and pricing";
    const heading = element("h2", item.master_items?.name ?? "Edit ingredient");
    heading.id = "stock-editor-title";
    heading.className = "text-2xl";
    const inputs = [...form.querySelectorAll("input, select")];
    let savedValues = inputs.map(input => input.type === "checkbox" ? input.checked : input.value);
    form.addEventListener("submit", () => { feedback.textContent = ""; }, {capture: true});
    edit.onclick = () => {
      inputs.forEach((input, index) => {
        if (input.type === "checkbox") input.checked = savedValues[index];
        else input.value = savedValues[index];
      });
      feedback.textContent = "";
      editor.replaceChildren(heading, form);
      editor.showModal();
    };
    const remove = element("button", "Remove");
    remove.type = "button";
    remove.className = "btn btn-ghost rounded-full text-error";
    remove.title = "Permanently remove this item and its stock and cost details from My Apothecary";
    remove.onclick = async () => {
      if (!window.confirm(`Remove ${name} from My Apothecary? Its stock and cost details will be deleted. You can add the ingredient again from the catalog.`)) return;
      remove.disabled = edit.disabled = lifecycle.disabled = true;
      const { data, error } = await db.from("inventory_items").delete()
        .eq("owner_id", item.owner_id).eq("master_item_id", item.master_item_id)
        .select("master_item_id").maybeSingle();
      if (!row.isConnected) return;
      if (error || !data) {
        remove.disabled = edit.disabled = lifecycle.disabled = false;
        tell("Could not remove the inventory item. Reload My Apothecary and try again.");
        return;
      }
      inventoryRows = inventoryRows.filter(entry => entry.row !== row);
      row.remove();
      detailRow.remove();
      sortInventory();
      tell(`${name} removed from My Apothecary.`);
    };
    actions.append(edit, lifecycle, remove);
    row.append(actions);
    inventoryRows.push({ item, row, detailRow, toggle });
  }
  sortInventory();
}

function show(session) {

  by("workspace").hidden = !session;
  if (session) { tell(""); void inventory(); }
  else { if (editor.open) editor.close(); ++loadVersion; inventoryRows = []; by("stock").replaceChildren(); tell("Sign in to view the catalog and your inventory."); }
}


db.auth.onAuthStateChange((event, session) => {
  if (["INITIAL_SESSION", "SIGNED_IN", "SIGNED_OUT"].includes(event)) setTimeout(() => show(session), 0);
});
</script>
</body>
</html>

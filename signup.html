<!doctype html>
<html lang="en" data-theme="brenda">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account | The Hidden Grimoire</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/grimoire-account.css">
  <style>
    main { width:min(calc(100% - 2rem),42rem); margin:2rem auto; }
    label { display:grid; gap:.3rem; }
    nav { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; }
  </style>
</head>
<body class="antialiased">
  <main class="surface-panel p-6">
    <p class="section-kicker">The Living Grimoire</p>
    <h1 class="dashboard-title mt-2">Create an account</h1>
    <p class="mt-2">Verify your email before signing in.</p>
    <form class="space-y-4 mt-4">
      <label>Display name <input class="input input-bordered rounded-full" name="display_name" autocomplete="nickname" required maxlength="100"></label>
      <label>Email <input class="input input-bordered rounded-full" name="email" type="email" autocomplete="email" required maxlength="254"></label>
      <label>Password <input class="input input-bordered rounded-full" name="password" type="password" autocomplete="new-password" required minlength="8"></label>
      <button type="submit" class="btn btn-primary rounded-full">Create account</button>
    </form>
    <p id="message" class="mt-4" role="status"></p>
  </main>
  <script type="module">
    import { bindSignup } from "/static/js/grimoire-account.js";
    bindSignup(document.querySelector("form"), document.getElementById("message"));
  </script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="brenda">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account | The Hidden Grimoire</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    main { width:min(calc(100% - 2rem),42rem); margin:2rem auto; }
    label { display:grid; gap:.3rem; }
    nav { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; }
  </style>
</head>
<body class="antialiased">
  <main class="surface-panel p-6">
    <nav aria-label="Workspace">
      <a href="/" class="btn btn-ghost rounded-full">Overview</a>
      <a href="/master-items.html" class="btn btn-ghost rounded-full">Master Items</a>
      <a href="/stores.html" class="btn btn-ghost rounded-full">Inventory</a>
    </nav>
    <p class="section-kicker">The Living Grimoire</p>
    <h1 class="dashboard-title mt-2">Create an account</h1>
    <p class="mt-2">Verify your email before signing in.</p>
    <form class="space-y-4 mt-4">
      <label>Display name <input class="input input-bordered" name="display_name" autocomplete="nickname" required maxlength="100"></label>
      <label>Email <input class="input input-bordered" name="email" type="email" autocomplete="email" required maxlength="254"></label>
      <label>Password <input class="input input-bordered" name="password" type="password" autocomplete="new-password" required minlength="8"></label>
      <button type="submit" class="btn btn-primary rounded-full">Create account</button>
      <a href="/master-items.html" class="btn btn-ghost rounded-full">Sign in</a>
    </form>
    <p id="message" class="mt-4" role="status"></p>
  </main>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";
const db = createClient("https://dfuanosyewsimvhdparf.supabase.co", "sb_publishable_biDbT_ZmXynIVLrgukrz5g_ZBTk84T7");
    const message = document.getElementById("message");
    const form = document.querySelector("form");
    form.onsubmit = async event => {
      event.preventDefault();
      const button = form.querySelector('[type="submit"]');
      const fields = new FormData(form);
      const displayName = fields.get("display_name").trim();
      if (!displayName) { message.textContent = "Enter a display name."; return; }
      button.disabled = true;
      try {
        const { error } = await db.auth.signUp({
          email: fields.get("email").trim().toLowerCase(),
          password: fields.get("password"),
          options: { data: { display_name: displayName } }
        });
        if (error && !["user_already_exists", "email_exists"].includes(error.code)) throw error;
        form.reset();
        message.textContent = "If this address can be registered, check your inbox for a verification link. If you already verified this email, sign in.";
      } catch { message.textContent = "Could not submit signup. Check your details or try again shortly."; }
      finally { button.disabled = false; }
    };
  </script>
</body>
</html>

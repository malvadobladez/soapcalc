<!doctype html>
<html lang="en" data-theme="brenda">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stores | The Hidden Grimoire</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/css/app.css">
<style>
    .grimoire-nav { display:flex; flex-wrap:wrap; gap:.25rem .75rem; }
    .grimoire-nav a { padding:.3rem .5rem; text-decoration:underline; text-underline-offset:.2em; }
    .grimoire-sidebar-nav { flex-direction:column; }
    .grimoire-sidebar-nav a { display:block; border-radius:.85rem; }
    .grimoire-nav a[aria-current='page'] { background:#efe4d0; color:#355846; }
    .grimoire-mobile { display:flex; }
    .grimoire-logo { width:8rem; }
    @media (min-width:768px) { .grimoire-mobile { display:none; } }
  </style>
</head>
<body class="app-shell antialiased">
<div class="workspace-frame">
<aside class="workspace-sidebar surface-panel p-5">
      <div class="sidebar-brand">
        <img class="sidebar-brand-logo grimoire-logo" src="/static/img/brand/site-logo.jpg" width="400" height="400" alt="">
        <p class="section-kicker">The Hidden Grimoire</p>
      </div>
      <nav class="grimoire-nav grimoire-sidebar-nav py-4" aria-label="Workspace">
        <a href="/">Overview</a>
        <a href="/stores.html" aria-current="page">Inventory</a>
        <a href="/master-items.html">Master Items</a>
        <a href="/#leaves">Tea recipes</a>
        <a href="/#calculus">Soap calculator</a>
      </nav>
      <div class="sidebar-art-shell">
        <img class="sidebar-art-image" src="/static/img/brand/sidebar-art.jpg" width="400" height="400" alt="" decoding="async">
      </div>
    </aside>
<main class="workspace-main">
  <header class="surface-panel px-5 py-4">
    <p class="section-kicker">The Living Grimoire</p>
    <p class="text-xl font-semibold">Inventory</p>
    <nav class="grimoire-nav grimoire-mobile" aria-label="Workspace">
          <a href="/">Overview</a><a href="/stores.html" aria-current="page">Inventory</a><a href="/master-items.html">Master Items</a>
          <a href="/#leaves">Tea recipes</a><a href="/#calculus">Soap calculator</a>
        </nav>
  </header>
  <section class="surface-panel p-6">
    <h1 class="text-4xl">The Stores</h1>
    <p id="status" role="status">Connecting…</p>
    <form id="login" class="space-y-4 mt-4" hidden>
      <label>Email <input name="email" class="input input-bordered" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" class="input input-bordered" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary">Sign in</button>
    </form>
    <div id="workspace" hidden>
      <button id="logout" type="button" class="btn btn-ghost">Sign out</button>
      <a href="/master-items.html" class="btn btn-ghost">Browse Master Items</a>
      <h2 class="text-2xl mt-4">My Inventory</h2>
      <p id="stock-empty" class="mt-4" hidden>Your inventory is empty.</p>
      <div style="overflow:auto"><table class="table mt-4">
        <thead><tr>
          <th scope="col"><button type="button" data-sort="name">Name</button></th>
          <th scope="col"><button type="button" data-sort="in_stock">In stock</button></th>
          <th scope="col"><button type="button" data-sort="purchase_total_cost">Purchase cost</button></th>
          <th scope="col"><button type="button" data-sort="purchase_weight_grams">Purchase weight (g)</button></th>
          <th scope="col">Actions</th>
        </tr></thead>
        <tbody id="stock"></tbody>
      </table></div>
    </div>
  </section>
</main>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";
const db = createClient("https://dfuanosyewsimvhdparf.supabase.co", "sb_publishable_biDbT_ZmXynIVLrgukrz5g_ZBTk84T7");
const by = id => document.getElementById(id);
const tell = message => { by("status").textContent = message; };
const element = (tag, value) => { const item = document.createElement(tag); item.textContent = value; return item; };

let inventoryRows = [];
let sortKey = "name";
let direction = 1;
let loadVersion = 0;
const headers = [...document.querySelectorAll("[data-sort]")];

function sortInventory() {
  const value = item => sortKey === "name" ? item.master_items?.name : item[sortKey];
  inventoryRows.sort(({ item: left }, { item: right }) => {
    const a = value(left);
    const b = value(right);
    if (a == null || b == null) return Number(a == null) - Number(b == null);
    const comparison = sortKey === "name" ? a.localeCompare(b) : Number(a) - Number(b);
    return direction * comparison || left.master_item_id - right.master_item_id;
  });
  for (const { row } of inventoryRows) by("stock").append(row);
  for (const button of headers) {
    const header = button.closest("th");
    if (button.dataset.sort === sortKey) header.setAttribute("aria-sort", direction === 1 ? "ascending" : "descending");
    else header.removeAttribute("aria-sort");
  }
}

for (const button of headers) button.onclick = () => {
  direction = sortKey === button.dataset.sort ? -direction : 1;
  sortKey = button.dataset.sort;
  sortInventory();
};

async function inventory() {
  const version = ++loadVersion;
  const { data, error } = await db.from("inventory_items")
    .select("master_item_id,in_stock,purchase_total_cost,purchase_weight_grams,master_items(name)")
    .order("master_item_id");
  if (version !== loadVersion || by("workspace").hidden) return;
  by("stock").replaceChildren();
  if (error) return tell("Could not load your inventory.");
  inventoryRows = [];
  by("stock-empty").hidden = Boolean(data.length);
  for (const item of data) {
    const row = document.createElement("tr");
    const form = document.createElement("form");
    form.id = "stock-item-" + item.master_item_id;
    row.append(element("th", item.master_items?.name ?? "Ingredient"));
    row.firstElementChild.scope = "row";
    function field(label, name, type, value, step) {
      const cell = document.createElement("td");
      const input = document.createElement("input");
      input.name = name;
      input.type = type;
      if (type === "checkbox") input.checked = value;
      else { input.value = value ?? ""; input.step = step; input.min = name === "grams" ? "0.001" : "0"; }
      input.setAttribute("aria-label", label + " for " + (item.master_items?.name ?? "ingredient"));
      input.setAttribute("form", form.id);
      cell.append(input);
      row.append(cell);
      return input;
    }
    const stocked = field("In stock", "stocked", "checkbox", item.in_stock);
    const cost = field("Purchase cost", "cost", "number", item.purchase_total_cost, "0.01");
    const grams = field("Purchase weight (g)", "grams", "number", item.purchase_weight_grams, "0.001");
    const save = element("button", "Save");
    save.className = "btn btn-primary";
    form.append(save);
    form.onsubmit = async event => {
      event.preventDefault();
      save.disabled = true;
      const { error } = await db.from("inventory_items").update({
        in_stock: stocked.checked, purchase_total_cost: cost.value || null, purchase_weight_grams: grams.value || null
      }).eq("master_item_id", item.master_item_id);
      save.disabled = false;
      if (!error) Object.assign(item, {in_stock: stocked.checked, purchase_total_cost: cost.value || null, purchase_weight_grams: grams.value || null});
      tell(error ? "Could not save the inventory item." : "Inventory item saved.");
    };
    const actions = document.createElement("td");
    actions.append(form);
    row.append(actions);
    inventoryRows.push({item, row});
  }
  sortInventory();
}

function show(session) {
  by("login").hidden = Boolean(session);
  by("workspace").hidden = !session;
  if (session) { tell(""); void inventory(); }
  else { ++loadVersion; inventoryRows = []; by("stock").replaceChildren(); tell("Sign in to view the catalog and your inventory."); }
}

by("login").onsubmit = async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const fields = new FormData(form);
  const button = form.querySelector("button");
  button.disabled = true;
  const { error } = await db.auth.signInWithPassword({ email: fields.get("email"), password: fields.get("password") });
  button.disabled = false;
  form.reset();
  if (error) tell("Sign-in failed. Check your email and password.");
};
by("logout").onclick = async () => { const { error } = await db.auth.signOut(); if (error) tell("Could not sign out."); };
db.auth.onAuthStateChange((event, session) => {
  if (["INITIAL_SESSION", "SIGNED_IN", "SIGNED_OUT"].includes(event)) setTimeout(() => show(session), 0);
});
</script>
</body>
</html>
